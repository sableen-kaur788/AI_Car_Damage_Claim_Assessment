<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Damage Detection</title>

```
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
```

</head>

<body>

<div class="container py-5">

```
<h1 class="text-center mb-4">🚗 Car Damage Detection</h1>

<!-- Upload Card -->
<div class="card bg-dark text-light shadow-lg">
    <div class="card-body">

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Upload Car Image</label>
                <input type="file" name="image" class="form-control" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg">
                    Detect Damage
                </button>
            </div>

        </form>

    </div>
</div>


<!-- Message -->
{% if message %}
<div class="alert alert-info text-center mt-4">
    {{ message }}
</div>
{% endif %}


<!-- Images Section -->
{% if original_image or result_image %}

<div class="row mt-4">

    {% if original_image %}
    <div class="col-md-6">

        <div class="card bg-dark text-light shadow">

            <div class="card-header text-center">
                Original Image
            </div>

            <div class="card-body text-center">
                <img src="{{ original_image }}" class="img-fluid rounded">
            </div>

        </div>

    </div>
    {% endif %}


    {% if result_image %}
    <div class="col-md-6">

        <div class="card bg-dark text-light shadow">

            <div class="card-header text-center">
                Detected Damage
            </div>

            <div class="card-body text-center">
                <img src="{{ result_image }}" class="img-fluid rounded">
            </div>

        </div>

    </div>
    {% endif %}

</div>

{% endif %}
```

</div>

</body>
</html>
